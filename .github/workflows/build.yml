name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Make sure no signing key is inside the project
        run: |
          bad=$(git ls-files | grep -iE '\.(jks|keystore|p12|pfx|pem|key)$|signing-secrets|keystore_base64' || true)
          if [ -n "$bad" ]; then echo "::error::Signing material committed: $bad"; exit 1; fi
          if git grep -qE 'BEGIN (RSA |EC )?PRIVATE KEY'; then echo "::error::A private key is committed"; exit 1; fi
          echo "OK: no keys in the repository"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch + patch LibretroDroid (DSLR shader, full screen)
        run: bash scripts/fetch_libretrodroid.sh

      - name: Download libretro cores
        run: bash scripts/fetch_cores.sh

      - name: Bundle offline game database + cheats
        run: bash scripts/fetch_db.sh

      - name: Decode signing key (optional)
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/release.jks
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV

      - name: Require the release key on main
        if: env.HAS_SIGNING_KEY != 'true' && github.event_name == 'push'
        run: |
          echo "::error::Signing secrets are missing. Add SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD (Settings > Secrets and variables > Actions). Without them the APK would not pass the app's integrity check."
          exit 1

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: DragonNES-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/DragonNES-v0.1.${{ github.run_number }}.apk"

      - name: Publish GitHub Release (every push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: DragonNES v0.1.${{ github.run_number }}
          make_latest: true
          body: |
            تطوير: مهند سات لنك
            نزّل ملف الـ APK من الأسفل ونصّبه.
            Signed with the release key: ${{ env.HAS_SIGNING_KEY }}
          files: dist/*.apk
